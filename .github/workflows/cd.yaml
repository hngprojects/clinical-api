name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging, main]

jobs:
  # ============================================
  # Deploy Staging (staging branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging'
    steps:
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/chima_nigerian/Clinical-be
            export PATH="$HOME/.local/bin:$PATH"

            git fetch origin staging
            git checkout staging
            git pull origin staging

            uv sync

            set -a
            source /home/chima_nigerian/Clinical-be/.env.staging
            set +a

            uv run alembic upgrade head

            pm2 start ecosystem.config.js --only staging,celery-worker-staging,flower-staging || \
            pm2 reload ecosystem.config.js --only staging,celery-worker-staging,flower-staging

            pm2 save

            echo "⏳ Waiting for API to be ready..."
            for i in $(seq 1 15); do
              curl -sf http://localhost:8004/api/v1/health && echo "✅ Staging deployment complete!" && exit 0
              sleep 2
            done
            echo "❌ Health check failed after deployment!"
            exit 1

  # ============================================
  # Deploy Production (main branch)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/chima_nigerian/Clinical-be
            export PATH="$HOME/.local/bin:$PATH"

            git fetch origin main
            git checkout main
            git pull origin main

            uv sync

            set -a
            source /home/chima_nigerian/Clinical-be/.env.production
            set +a

            uv run alembic upgrade head

            pm2 start ecosystem.config.js --only production,celery-worker-production,flower-production || \
            pm2 reload ecosystem.config.js --only production,celery-worker-production,flower-production

            pm2 save

            echo "⏳ Waiting for API to be ready..."
            for i in $(seq 1 15); do
              curl -sf http://localhost:8001/api/v1/health && echo "✅ Production deployment complete!" && exit 0
              sleep 2
            done
            echo "❌ Health check failed after deployment!"
            exit 1
