name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging, main]

jobs:
  # ============================================
  # Deploy Staging (staging branch)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging'
    steps:
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/chima_nigerian/Clinical-be
            export PATH="$HOME/.local/bin:$PATH"

            git fetch origin staging
            git checkout staging
            git pull origin staging

            uv sync

            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            export GOOGLE_REDIRECT_URI="${{ secrets.GOOGLE_REDIRECT_URI }}"
            export OTP_PEPPER="${{ secrets.OTP_PEPPER }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export RESEND_FROM_EMAIL="${{ secrets.RESEND_FROM_EMAIL }}"

            uv run alembic upgrade head

            pm2 start ecosystem.config.js --only staging,celery-worker-staging,flower-staging || \
            pm2 reload ecosystem.config.js --only staging,celery-worker-staging,flower-staging

            pm2 save
            echo "✅ Staging deployment complete!"

  # ============================================
  # Deploy Production (main branch)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment: production
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/chima_nigerian/Clinical-be
            export PATH="$HOME/.local/bin:$PATH"

            git fetch origin main
            git checkout main
            git pull origin main

            uv sync

            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            export GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            export GOOGLE_REDIRECT_URI="${{ secrets.GOOGLE_REDIRECT_URI }}"
            export OTP_PEPPER="${{ secrets.OTP_PEPPER }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
            export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
            export RESEND_FROM_EMAIL="${{ secrets.RESEND_FROM_EMAIL }}"

            uv run alembic upgrade head

            pm2 start ecosystem.config.js --only production,celery-worker-production,flower-production || \
            pm2 reload ecosystem.config.js --only production,celery-worker-production,flower-production

            pm2 save
            echo "✅ Production deployment complete!"
