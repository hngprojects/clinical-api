<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Clinsight Verification Code</title>
    <style>
      @media only screen and (max-width:480px) {
        .container { padding: 16px !important; border-radius: 0 !important; box-shadow: none !important; }
        h1 { font-size: 22px !important; }
        p { font-size: 15px !important; }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; font-family: Arial, sans-serif; color: #333333; background-color: #f7f7f7; width: 100%; padding: 20px 0;">
    <div class="container" style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);">
      <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 24px;">Your Clinsight Verification Code</h1>
      <div style="background-color: #f5f5f5; padding: 18px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
        <p style="font-size: 14px; line-height: 1.6; color: #666666; margin: 0 0 12px;">Verification Code</p>
        <p style="font-size: 36px; font-weight: 700; margin: 0;">{{ pin }}</p>
      </div>
      <div style="background-color: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 16px; border-radius: 8px; margin-bottom: 20px;">
        <p style="font-size: 14px; line-height: 1.6; color: #666666; margin: 0;">Never share this code with anyone</p>
      </div>
      <div style="background-color: #fef9c3; border: 1px solid #facc15; color: #92400e; padding: 16px; border-radius: 8px; margin-bottom: 20px;">
        <p style="font-size: 14px; line-height: 1.6; color: #666666; margin: 0;">This code will expire in {{ expiration_time }}.</p>
      </div>
      <p style="font-size: 14px; line-height: 1.6; color: #666666; margin: 0 0 20px;">If you did not request this, you can ignore this email.</p>
      <div style="border-top: 1px solid #e5e7eb; padding-top: 20px; font-size: 14px; color: #666666;">
        <p style="margin: 0 0 8px;">The Clinsight Team</p>
        <p style="margin: 0 0 8px;">© 2026 Clinsight. All rights reserved</p>
      </div>
    </div>
  </body>
</html>
