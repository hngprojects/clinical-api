[project]
name = "clinsights"
version = "0.1.0"
description = "An AI-powered laboratory result interpretation app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "psycopg2-binary>=2.9.12",
    "pre-commit>=4.6.0",
    "httpx>=0.28.1",
    "pyjwt>=2.12.0",
    "bcrypt>=5.0.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "resend>=0.8.0",
    "psycopg[binary]>=3.3.4",
    "flower>=2.0.1",
    "pip-audit>=2.10.0",
    "urllib3>=2.7.0",
    "bandit>=1.9.4",
    "python-decouple>=3.8",
    "reportlab>=4.0.0",
    "aiofiles>=25.1.0",
    "jinja2>=3.1.0",
    "minio>=7.2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.15.12",
    "faker>=40.15.0",
    "pytest-pylembic>=0.3.0",
    "commitizen>=4.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
	"no_db: test does not require Postgres (skips session DB setup when all selected tests use it)",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["alembic", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version"
]